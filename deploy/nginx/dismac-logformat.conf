# /etc/nginx/conf.d/dismac-logformat.conf  (contexto http)
# Formato que espera agente-http/features.py (perfil nginx-request-v1):
# combinado + request_time + upstream_response_time + X-Forwarded-For.
# Debe coincidir con el de los logs usados para entrenar (p. ej. $body_bytes_sent).
log_format dismac '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  '$request_time $upstream_response_time "$http_x_forwarded_for"';
